4. Inside your project(github-deployment) folder, create these folders:

.github(folder)

Inside .github, create:

workflows(folder)

Inside workflows, create:

deploy.yml(file)

So the folder structure becomes:

github-deployment

│

├── index.html

│

└── .github

    └── workflows

        └── deploy.yml

4. Open:

deploy.yml

Write:

name: Deploy Website

 

on:

  push:

    branches:

      - main

 

permissions:

  contents: read

  pages: write

  id-token: write

 

jobs:

  deploy:

    runs-on: ubuntu-latest

 

    steps:

      - name: Checkout code

        uses: actions/checkout@v4

 

      - name: Setup Pages

        uses: actions/configure-pages@v5

 

      - name: Upload website

        uses: actions/upload-pages-artifact@v3

        with:

          path: '.'

 

      - name: Deploy to GitHub Pages


        uses: actions/deploy-pages@v4

5. Open the terminal.

Run:

git add .

Then:

git commit -m "Add deployment workflow"

Then:

git push

Now GitHub automatically detects the workflow.

6. In the GitHub repository, go to:

Settings → Pages

Under Build and deployment, select:

Source: GitHub Actions

GitHub Pages will use the workflow to deploy the website.

After deployment, GitHub provides a website URL similar to:

https://username.github.io/github-deployment/

Open this URL in the browser.

You should see:

Application Deployed Successfully!



